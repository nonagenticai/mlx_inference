# Pre-commit hooks for mlx_inference (Rust).
# Install: pre-commit install -t pre-commit -t pre-push
# Run all: pre-commit run --all-files
#
# The Rust gate also runs in CI (.github/workflows/tests.yml); pre-commit keeps
# the language-agnostic hygiene hooks and runs the same cargo checks locally.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Unified-diff context lines and captured wire bodies are byte-exact.
      - id: trailing-whitespace
        exclude: ^patches/.*\.patch$
      - id: end-of-file-fixer
        exclude: ^patches/.*\.patch$|^tests/contract/probes/
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # Rust formatting and lints run before a push.
  - repo: local
    hooks:
      # Same scanner and same rules as CI (.github/workflows/secret-scan.yml):
      # the fleet betterleaks config, vendored into `.betterleaks.toml` — a
      # repo-local config replaces the fleet one rather than merging with it, so
      # it has to carry the estate rules verbatim. See that file's header before
      # editing it. Install the binary with `brew install betterleaks`;
      # `scripts/setup-dev.sh` does that for you.
      - id: betterleaks
        name: betterleaks (staged changes)
        entry: betterleaks git --pre-commit --staged --redact --no-banner --config .betterleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy (-D warnings)
        entry: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-push]

      - id: cargo-test
        name: cargo test (workspace)
        entry: cargo test --manifest-path rust/Cargo.toml --workspace
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-push]

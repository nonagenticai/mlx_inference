[package]
name = "mlx-inference-server"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
ipnet = "=2.12.2"
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tokio-util = { version = "=0.7.20", features = ["codec"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
http-body-util = "=0.1.5"
rand = "=0.8.8"
rsa = "=0.9.10"
tempfile = "=3.27.0"

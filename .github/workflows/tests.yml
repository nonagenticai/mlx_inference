name: Tests

# The server is Rust end to end and the tests are platform-neutral: the engine
# boundary is exercised against a fake SSE peer, and the one macOS-only probe
# (`proc_pid_rusage`, in the worker module) is behind `cfg(target_os = "macos")`.
# The artifact only *runs* on Apple Silicon with MLX and Metal; the gate runs
# anywhere, so it uses a hosted Linux runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The public-tree rule, second half: betterleaks catches credentials, this catches the
  # identifiers around them — internal hostnames, tailnet/CGNAT addresses and private
  # repository paths. mlx_inference was the one public repo in the estate without it.
  # Allowlist and its justifications: `.ci/private-refs.allow`.
  no-private-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - name: scan tracked files
        run: bash scripts/ci/no-private-refs.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6.0.2

      # The toolchain action needs its own copy of the version, and that copy silently
      # drifted from `rust-toolchain.toml` (it still said 1.99.1 while the pin said 1.100.0,
      # so `cargo fmt` auto-installed the pinned one WITHOUT components and failed). Keep them
      # equal, and assert it on every run so the next drift is loud instead of mysterious.
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Assert the CI toolchain matches rust-toolchain.toml
        run: |
          set -euo pipefail
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | awk '{print $2}')
          echo "pin=$want ci=$got"
          [ "$want" = "$got" ] || { echo "::error::CI toolchain $got != pin $want"; exit 1; }

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: rust
        run: cargo test --workspace

name: Tests

# The server is Rust end to end and the tests are platform-neutral: the engine
# boundary is exercised against a fake SSE peer, and the one macOS-only probe
# (`proc_pid_rusage`, in the worker module) is behind `cfg(target_os = "macos")`.
# The artifact only *runs* on Apple Silicon with MLX and Metal; the gate runs
# anywhere, so it uses a hosted Linux runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: rust
        run: cargo test --workspace

name: Secret scan

# Full-history secret scan with betterleaks (https://betterleaks.com), the
# MIT-licensed successor to gitleaks. The rules are the fleet config, vendored
# into `.betterleaks.toml` — a repo-local config replaces the fleet one rather
# than merging with it, so the file carries the estate rules verbatim instead of
# only an allowlist. `.pre-commit-config.yaml` runs the same scanner on staged
# changes with the same file.
#
# This is the detective layer. It runs after a commit exists, so it cannot stop
# a secret from being pushed. Server-side push protection — GitHub's, enabled in
# the repository's security settings — is the preventive layer and is what
# blocks the push itself.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: "1.10.1"

jobs:
  betterleaks:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # full history: a secret may live in any commit

      - name: Install betterleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          asset="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar xzf "${asset}" betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks

      - name: Scan
        run: betterleaks git . --config .betterleaks.toml --redact --no-banner --verbose
